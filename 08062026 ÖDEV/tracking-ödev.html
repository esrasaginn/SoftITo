<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white p-8 rounded-xl shadow-sm max-w-xl w-full space-y-6">
        
        <div class="border-b pb-2 mb-4">
            <h1 class="text-lg font-bold text-gray-800">Tracking</h1>
        </div>

        <div class="flex items-center">
            <span class="w-32 text-xs font-mono text-gray-400 shrink-0">tracking-tighter:</span>
            <p class="text-xl font-medium text-gray-800 tracking-tighter">
                TAILWIND CSS TRACKING
            </p>
        </div>

        <div class="flex items-center">
            <span class="w-32 text-xs font-mono text-gray-400 shrink-0">tracking-tight:</span>
            <p class="text-xl font-medium text-gray-800 tracking-tight">
                TAILWIND CSS TRACKING
            </p>
        </div>

        <div class="flex items-center">
            <span class="w-32 text-xs font-mono text-gray-400 shrink-0">tracking-normal:</span>
            <p class="text-xl font-medium text-gray-800 tracking-normal">
                TAILWIND CSS TRACKING
            </p>
        </div>

        <div class="flex items-center">
            <span class="w-32 text-xs font-mono text-gray-400 shrink-0">tracking-wide:</span>
            <p class="text-xl font-medium text-gray-800 tracking-wide">
                TAILWIND CSS TRACKING
            </p>
        </div>

        <div class="flex items-center">
            <span class="w-32 text-xs font-mono text-gray-400 shrink-0">tracking-wider:</span>
            <p class="text-xl font-medium text-gray-800 tracking-wider">
                TAILWIND CSS TRACKING
            </p>
        </div>

        <div class="flex items-center">
            <span class="w-32 text-xs font-mono text-gray-400 shrink-0">tracking-widest:</span>
            <p class="text-xl font-medium text-gray-800 tracking-widest">
                TAILWIND CSS TRACKING
            </p>
        </div>

        <div class="flex items-center">
            <span class="w-32 text-xs font-mono text-gray-400 shrink-0">tracking-[7px]:</span>
            <p class="text-xl font-medium text-gray-800 tracking-[7px]">
                TAILWIND CSS TRACKING
            </p>
        </div>

    </div>

</body>
</html>
