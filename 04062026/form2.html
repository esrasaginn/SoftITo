<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="bilgi-formu">
        <label for="isim">İsim:</label>
        <input type="text" id="isim">

        <label for="soyisim">Soyisim:</label>
        <input type="text" id="soyisim">

        <label for="tel">Telefon Numarası:</label>
        <input type="text" id="tel">

        <label for="resim">Fotoğraf:</label>
        <input type="file" id="resim" accept="image/*">

        <button type="submit">Gönder</button>
    </form>

    <div id="sonuc" style="display: none; margin-top: 20px;">
        <h3>Girilen Bilgiler:</h3>
        <p>Ad: <span id="yaz-isim"></span></p>
        <p>Soyad: <span id="yaz-soyisim"></span></p>
        <p>Telefon: <span id="yaz-tel"></span></p>
        <p>Önizleme Resmi:</p>
        <img id="onizleme-resim" src="" alt="Önizleme" style="display: none; max-width: 200px;">
    </div>

    <script>
        const form = document.getElementById("bilgi-formu");
        const sonucDiv = document.getElementById("sonuc");

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            const isim = document.getElementById("isim").value;
            const soyisim = document.getElementById("soyisim").value;
            const tel = document.getElementById("tel").value;
            const resimInput = document.getElementById("resim");

            document.getElementById("yaz-isim").textContent = isim;
            document.getElementById("yaz-soyisim").textContent = soyisim;
            document.getElementById("yaz-tel").textContent = tel;

            const resimDosyasi = resimInput.files[0];
            const imgElement = document.getElementById("onizleme-resim");

            if (resimDosyasi) {
                const reader = new FileReader();

                reader.onload = function (olay) {
                    imgElement.src = olay.target.result;
                    imgElement.style.display = "block";
                };

                reader.readAsDataURL(resimDosyasi);
            } else {
                imgElement.style.display = "none";
            }

            sonucDiv.style.display = "block";
        });
    </script>
</body>
</html>
