<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Merhaba</h1>
    <button id="change">Değiştir</button>
    <p id="yazi">Merhaba Tekrar</p>
    <script>
        const buton = document.getElementById('change');
        const yazi = document.getElementById('yazi');
        let tiklanmasayisi = 0;
        buton.addEventListener('click',function(){
            tiklanmasayisi++;
            if(tiklanmasayisi ==1){
                yazi.textContent='Butona Tıklandı';
            }else{
                yazi.textContent='Butona Tıklandı Yeni'
            }
            yazi.textContent='Butona Tıklandı';

        });

    </script>


</body>
</html>
